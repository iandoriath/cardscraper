name: Daily Wrestling Data Update

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST / 10 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout gh-pages branch for existing data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-files
        continue-on-error: true

      - name: Copy existing data files
        run: |
          if [ -d "gh-pages-files" ]; then
            cp gh-pages-files/*.json . 2>/dev/null || true
            cp gh-pages-files/*.csv . 2>/dev/null || true
            echo "Copied existing data files from gh-pages"
            ls -la *.json *.csv 2>/dev/null || echo "No data files found"
          else
            echo "No existing gh-pages branch found - will create fresh"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        run: python daily_update.py

      - name: Generate dashboard
        run: python generate_dashboard.py

      - name: Prepare site output
        run: |
          mkdir -p site-output
          cp index.html site-output/
          cp *.json site-output/ 2>/dev/null || true
          cp *.csv site-output/ 2>/dev/null || true
          echo "Site output contents:"
          ls -la site-output/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-output
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "Update dashboard - ${{ github.run_id }}"
