name: Daily Wrestling Data Update

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST / 10 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout gh-pages branch for existing data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-files
        continue-on-error: true

      - name: Copy existing data files
        run: |
          if [ -d "gh-pages-files" ]; then
            cp gh-pages-files/*.Rds . 2>/dev/null || true
            cp gh-pages-files/*.csv . 2>/dev/null || true
            echo "Copied existing data files from gh-pages"
          else
            echo "No existing gh-pages branch found - will create fresh"
          fi

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ hashFiles('renv.lock') }}
          restore-keys: r-packages-

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('tidyverse', 'lubridate', 'rvest', 'hash', 'rmarkdown', 'flexdashboard', 'plotly', 'DT', 'htmlwidgets', 'scales'), repos='https://cloud.r-project.org')"

      - name: Run daily update
        run: Rscript daily_update.R

      - name: Build dashboard
        run: |
          Rscript -e "rmarkdown::render('dashboard.Rmd', output_file='index.html')"

      - name: Prepare site output
        run: |
          mkdir -p site-output
          cp index.html site-output/
          cp *.Rds site-output/ 2>/dev/null || true
          cp wrestler_summary_stats.csv site-output/ 2>/dev/null || true
          cp match_predictions.csv site-output/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-output
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "Update dashboard - ${{ github.run_id }}"
